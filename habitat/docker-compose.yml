services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: habitat
      POSTGRES_DB: habitat
    ports:
      - '5432:5432'
    volumes:
      - habitat-db:/var/lib/postgresql/data
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: habitat
      POSTGRES_DB: habitat_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  habitat-db:
