services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brock
      POSTGRES_PASSWORD: brock
      POSTGRES_DB: brock
    ports:
      - '5432:5432'
    volumes:
      - brock-db:/var/lib/postgresql/data
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: brock
      POSTGRES_PASSWORD: brock
      POSTGRES_DB: brock_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  brock-db:
